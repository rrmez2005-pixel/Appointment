<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>

    <!--Stylesheet-->
    <link rel="stylesheet" href = "styles/styles.css">

    <!-- JavaScript -->
    <script src="scripts/appointment.js" defer></script>

</head>
<body>
    <form id="Contact-Form" action="#" method="get">
        <h1>Appointment Scheduler</h1>

        <div class="information">
            <div class="tab">
                <label for="fname">First Name</label>
                <input type="text" id ="fname" name="fname">
                <span class="err" id="err-fname">First name is required</span>
            </div>

            <div class="tab">
                <label for="lname">Last Name</label>
                <input type="text" id ="lname" name="lname">
                <span class="err" id="err-lname">Last name is required</span>
            </div>

            <div class="tab">
                <label for="mdate">Meeting Date</label>
                <input type="text" id ="mdate" name="mdate">
                <span class="err" id="err-mdate">Meeting Date is required</span>
            </div>

            <div class="tab">
                <label for="mtime">Meeting Time</label>
                <input type="text" id ="mtime" name="mtime">
                <span class="err" id="err-mtime">Meeting Time is required</span>
            </div>
        </div>

         <!-- Book Appointment Button -->
         <button type="submit">Book Appointment</button>
    </form>
</body>
</html>
